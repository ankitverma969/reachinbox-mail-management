name: CI/CD Pipeline & AWS Auto-Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------
  # Job 1: Test & Quality Gate
  # -------------------------------------------------------------
  quality-gate:
    name: Run Automated Tests & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Backend Typecheck & Lint
        working-directory: backend
        run: |
          npm run typecheck
          npm run lint

      - name: Run Backend Tests
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_minimum_32_characters_long_for_ci
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          ADMIN_PASSWORD: test_admin_password_for_ci_checks
          ADMIN_API_KEY: test_admin_api_key_for_ci_checks
        run: npm test

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend Typecheck & Lint
        working-directory: frontend
        run: |
          npm run typecheck
          npm run lint

      - name: Run Frontend Tests
        working-directory: frontend
        run: npm test

      - name: Build Frontend Production Bundle
        working-directory: frontend
        run: npm run build

  # -------------------------------------------------------------
  # Job 2: Deploy to AWS Server (EC2)
  # -------------------------------------------------------------
  deploy-to-aws:
    name: Deploy to AWS Server via SSH
    needs: quality-gate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Execute Deployment Commands on AWS Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          port: ${{ secrets.AWS_PORT || 22 }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -e
            echo "🚀 Starting automated deployment on AWS server..."
            
            # Navigate to application repository directory
            cd ${{ secrets.DEPLOY_PATH || '/home/ubuntu/reachinbox-hiring-assignment' }}
            
            # Fetch latest commits from main
            echo "📥 Pulling latest changes from Git..."
            git fetch origin main
            git reset --hard origin/main
            
            # Verify Docker & Docker Compose are available
            command -v docker >/dev/null 2>&1 || { echo "Docker is not installed on AWS server!"; exit 1; }
            
            # Pull supporting images and rebuild backend container
            echo "🔨 Building and restarting ReachInbox Backend container..."
            docker compose pull postgres redis elasticsearch || true
            docker compose build backend
            docker compose up -d --remove-orphans
            
            # Wait for backend health probe
            echo "⏳ Waiting for backend container health check..."
            sleep 10
            
            # Apply Prisma migrations inside the running container
            echo "📦 Running Prisma database migrations..."
            docker compose exec -T backend npx prisma migrate deploy || docker compose exec -T backend npx prisma db push
            
            # Health check verification
            echo "🩺 Verifying backend health..."
            docker compose exec -T backend curl -sf http://localhost:5000/api/health || {
              echo "❌ Health check failed! Inspecting logs:";
              docker compose logs --tail=50 backend;
              exit 1;
            }
            
            # Clean up dangling images to prevent disk exhaustion
            echo "🧹 Cleaning up unused Docker images..."
            docker image prune -f
            
            echo "✅ ReachInbox Backend successfully deployed and healthy on AWS!"
